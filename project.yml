name: HotspotProxy
options:
  bundleIdPrefix: com.indoyoon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko
settings:
  base:
    DEVELOPMENT_TEAM: 5DUM8WPB4C
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HotspotProxy:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Resources
    dependencies:
      - target: HotspotProxyWidget
    entitlements:
      path: Config/HotspotProxy.entitlements
      properties:
        com.apple.security.application-groups: [group.com.indoyoon.hotspotproxy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indoyoon.hotspotproxy
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 핫스팟 프록시
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: 핫스팟에 연결된 기기의 프록시 요청을 받기 위해 필요합니다.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.indoyoon.hotspotproxy
            CFBundleURLSchemes: [hotspotproxy]
  HotspotProxyWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    entitlements:
      path: Config/HotspotProxyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.indoyoon.hotspotproxy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indoyoon.hotspotproxy.widget
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 핫스팟 프록시
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
